name: "Validate Gradle Wrapper"

on:
  workflow_dispatch:
  # NOTE(claw800): upstream Termux CI triggers disabled during Phase 2
  # iteration to avoid burning Actions minutes on every master push / PR.
  # Re-enable selectively once the fork stabilizes.
  # push:
  #   branches:
  #     - master
  #     - android-10
  # pull_request:
  #   branches:
  #     - master
  #     - android-10

jobs:
  validation:
    name: "Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@5
