name: Upload Termux APK to Aliyun OSS

on:
  workflow_dispatch:
    inputs:
      oss_deploy_env:
        description: "OSS prefix dev | uat | prod → {env}/artifacts/apks/..."
        type: choice
        required: false
        default: dev
        options:
          - dev
          - uat
          - prod
  release:
    types: [published]

jobs:
  upload-termux-universal:
    if: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID != '' && secrets.ALIYUN_OSS_ACCESS_KEY_SECRET != '' }}
    runs-on: ubuntu-latest
    env:
      PACKAGE_VARIANT: apt-android-7
      RELEASE_TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      OSS_DEPLOY_ENV: ${{ github.event_name == 'release' && 'prod' || (inputs.oss_deploy_env || 'dev') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install ossutil 2.0
        env:
          OSSUTIL2_VER: "2.2.1"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/ossutil.zip" \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL2_VER}/ossutil-${OSSUTIL2_VER}-linux-amd64.zip"
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          unzip -q "$tmp/ossutil.zip" -d "$tmp/extract"
          sudo install -m 0755 "$tmp/extract/ossutil-${OSSUTIL2_VER}-linux-amd64/ossutil" /usr/local/bin/ossutil
          rm -rf "$tmp"
          ossutil --version

      - name: Build debug universal APK
        shell: bash {0}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          GITHUB_SHA="${GITHUB_SHA}"
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"
          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${PACKAGE_VARIANT}-github-debug"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="${PACKAGE_VARIANT}"
          ./gradlew assembleDebug --no-daemon
          test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_universal.apk"
          echo "APK_PATH=$APK_DIR_PATH/${APK_BASENAME_PREFIX}_universal.apk" >> "$GITHUB_ENV"
          if [[ -n "${RELEASE_TAG_NAME:-}" ]]; then
            OSS_V_RAW="${RELEASE_TAG_NAME}"
          else
            OSS_V_RAW="${RELEASE_VERSION_NAME}"
          fi
          OSS_V=$(echo "$OSS_V_RAW" | sed 's/[^a-zA-Z0-9._+-]/_/g')
          PREFIX="${OSS_DEPLOY_ENV}/artifacts/apks/800claw-termux-app"
          echo "OSS_PINNED_KEY=${PREFIX}/800claw-termux-app-${OSS_V}-universal.apk" >> "$GITHUB_ENV"
          echo "OSS version slug: ${OSS_V} (pinned key in GITHUB_ENV)"

      - name: Upload to OSS
        run: |
          set -euo pipefail
          chmod +x scripts/oss-upload-apk.sh
          scripts/oss-upload-apk.sh "$APK_PATH" "$OSS_PINNED_KEY"
          scripts/oss-upload-apk.sh "$APK_PATH" "${OSS_DEPLOY_ENV}/artifacts/apks/800claw-termux-app/800claw-termux-app-latest-universal.apk"
        env:
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
