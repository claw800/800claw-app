name: Unit tests

on:
  workflow_dispatch:
  # NOTE(claw800): upstream Termux CI triggers disabled during Phase 2
  # iteration to avoid burning Actions minutes on every master push / PR.
  # Re-enable selectively once the fork stabilizes.
  # push:
  #   branches:
  #     - master
  #     - android-10
  # pull_request:
  #   branches:
  #     - master
  #     - android-10

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Setup java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Execute tests
      run: |
        ./gradlew test
