name: Build Custom Termux Bootstrap (with proot pre-bundled)

# NOTE(claw800): This workflow produces Termux bootstrap zips with `proot` (and
# optionally `proot-distro`) pre-installed, so our runtime APK can launch the
# pre-baked Ubuntu rootfs offline on first run without requiring the end user
# to run `pkg install proot` manually.
#
# We use Termux's own generate-bootstraps.sh (from termux/termux-packages)
# rather than hand-rolling an "augment downloaded bootstrap" pipeline, because
# that tool already correctly:
#   - resolves .deb dependencies
#   - rewrites SYMLINKS.txt (Termux bootstrap custom symlink manifest)
#   - pulls per-arch .debs from the upstream package repo
#
# Dispatch-only, matching the Phase 2 policy of avoiding auto-runs on push.
on:
  workflow_dispatch:
    inputs:
      extra_packages:
        description: "Comma-separated extra packages to add to the bootstrap"
        required: false
        # mandoc is included so that update-alternatives postinst scripts
        # (less, nano, cat, etc.) can find `makewhatis` and stop emitting
        # "skipping updating manpage database" warnings during Termux
        # bootstrap second-stage.
        default: "proot,proot-distro,mandoc"
      architectures:
        description: "Comma-separated architectures (termux naming: aarch64,x86_64,arm,i686)"
        required: false
        default: "aarch64,x86_64"
      package_variant:
        description: "Package variant: apt-android-7 (modern) or apt-android-5 (legacy)"
        required: false
        default: "apt-android-7"

jobs:
  build-custom-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout claw800 fork
        uses: actions/checkout@v6

      - name: Clone termux-packages and make the mount writable by any UID
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/termux/termux-packages.git termux-packages
          # IMPORTANT (context for future readers):
          #
          # The termux/package-builder Docker image is built with
          #     useradd -u 1001 -U -m builder
          #     USER builder:builder
          #     WORKDIR /home/builder/termux-packages
          # i.e. the container's "builder" user is UID 1001 and CWD in
          # docker exec is the mounted /home/builder/termux-packages dir.
          #
          # generate-bootstraps.sh finishes with:
          #     mv -f "$BOOTSTRAP_TMPDIR/bootstrap-<arch>.zip" ./
          # which lands inside the mount. If the host-side owner of that
          # dir is any UID other than 1001, that mv fails with
          #     mv: cannot create regular file './bootstrap-<arch>.zip':
          #     Permission denied
          #
          # GitHub-hosted ubuntu runners are not guaranteed to be UID 1001
          # (and empirically are not — the original and chown-to-1000
          # variants both failed here). Rather than play the UID-matching
          # game, make the cloned tree world-writable. This is a build
          # scratch dir with no secrets; it's discarded when the job ends.
          sudo chmod -R a+rwX termux-packages
          echo "--- host runner id ---"
          id
          echo "--- termux-packages top-level (host view) ---"
          ls -lan termux-packages | head -5

      - name: Diagnose container user (one-time probe)
        working-directory: termux-packages
        run: |
          # Prints the UID/GID the container sees and the top-level
          # perms on the mounted dir, so future permission-denied
          # failures can be diagnosed from the log alone.
          ./scripts/run-docker.sh id
          ./scripts/run-docker.sh sh -c 'ls -lan /home/builder/termux-packages | head -5'

      - name: Generate bootstrap zips with extra packages
        working-directory: termux-packages
        env:
          EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || 'proot,proot-distro,mandoc' }}
          ARCHITECTURES: ${{ github.event.inputs.architectures || 'aarch64,x86_64' }}
          PACKAGE_VARIANT: ${{ github.event.inputs.package_variant || 'apt-android-7' }}
        run: |
          set -euo pipefail
          echo "Building with: arch=${ARCHITECTURES} variant=${PACKAGE_VARIANT} extras=${EXTRA_PACKAGES}"
          # run-docker.sh pulls the official termux-packages build image on the
          # first invocation and runs the given command inside it with the repo
          # mounted at /home/builder/termux-packages.
          #
          # IMPORTANT: run-docker.sh loads a *restricted* AppArmor profile
          # (scripts/profile-restricted.apparmor) that contains:
          #   deny /home/builder/termux-packages/[^o]** wlk
          #   allow /home/builder/termux-packages/output/** rw
          # i.e. the container may only write inside an output/ subdir
          # of the mounted repo. generate-bootstraps.sh finishes with
          #   mv -f "$BOOTSTRAP_TMPDIR/bootstrap-<arch>.zip" ./
          # which lands wherever the caller's CWD is at that point.
          # When we simply run ./scripts/run-docker.sh ./scripts/generate-bootstraps.sh,
          # CWD in the container = WORKDIR = /home/builder/termux-packages,
          # and the mv is vetoed by AppArmor as EACCES ("Permission denied")
          # even though POSIX perms show 0777 and owner=1001 (the container
          # user) — this was the mysterious failure we hit.
          #
          # Workaround: pre-create an output/ directory on the host and wrap
          # the generate-bootstraps.sh invocation so its CWD inside the
          # container is /home/builder/termux-packages/output. The wrapper
          # is dropped into output/ itself (the only writable path), so it
          # doesn't trip the deny rule when docker exec pulls it up.
          mkdir -p output
          cat > output/run-gen.sh <<'INNER_EOF'
          #!/bin/bash
          set -euo pipefail
          cd /home/builder/termux-packages/output
          ../scripts/generate-bootstraps.sh \
            --architectures "$1" \
            --add "$2"
          INNER_EOF
          chmod +x output/run-gen.sh
          ./scripts/run-docker.sh /home/builder/termux-packages/output/run-gen.sh \
            "${ARCHITECTURES}" \
            "${EXTRA_PACKAGES}"

      - name: Stage output and compute checksums
        env:
          EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || 'proot,proot-distro,mandoc' }}
          PACKAGE_VARIANT: ${{ github.event.inputs.package_variant || 'apt-android-7' }}
        run: |
          set -euo pipefail
          OUT_ROOT="tools/bootstrap/output-custom/${PACKAGE_VARIANT}"
          mkdir -p "$OUT_ROOT"
          # With the AppArmor workaround above, generate-bootstraps.sh now
          # writes bootstrap-<arch>.zip into termux-packages/output/.
          shopt -s nullglob
          moved=0
          for f in termux-packages/output/bootstrap-*.zip; do
            cp "$f" "$OUT_ROOT/"
            moved=$((moved+1))
          done
          if [[ $moved -eq 0 ]]; then
            echo "ERROR: no bootstrap-*.zip produced by generate-bootstraps.sh" >&2
            ls -lah termux-packages/output || true
            exit 1
          fi
          {
            echo "# Custom Termux bootstrap zips"
            echo "# package_variant=${PACKAGE_VARIANT}"
            echo "# extra_packages=${EXTRA_PACKAGES}"
            echo "# generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# generator=termux/termux-packages@$(cd termux-packages && git rev-parse HEAD)"
          } > "$OUT_ROOT/MANIFEST.txt"
          (cd "$OUT_ROOT" && find . -maxdepth 1 -type f -name "bootstrap-*.zip" -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          echo "--- Output ---"
          ls -lah "$OUT_ROOT"
          echo "--- SHA256SUMS.txt ---"
          cat "$OUT_ROOT/SHA256SUMS.txt"
          echo "--- MANIFEST.txt ---"
          cat "$OUT_ROOT/MANIFEST.txt"

      - name: Upload custom bootstrap artifacts
        uses: actions/upload-artifact@v6
        with:
          name: termux-custom-bootstraps
          path: |
            tools/bootstrap/output-custom/**
          if-no-files-found: error
