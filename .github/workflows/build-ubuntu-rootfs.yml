name: Build Ubuntu Rootfs

on:
  workflow_dispatch:
    inputs:
      enable_browser_stack:
        description: "Install browser-use + Playwright Chromium stack"
        required: false
        default: "0"
  # NOTE(claw800): kept for future reference. Disabled for now to avoid expensive
  # auto-runs on every matching push during Phase 2 iteration.
  # push:
  #   branches:
  #     - master
  #     - 'upgrade/**'
  #   paths:
  #     - 'tools/bootstrap/bake-ubuntu.Dockerfile'
  #     - 'tools/bootstrap/bake-ubuntu.sh'
  #     - '.github/workflows/build-ubuntu-rootfs.yml'

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64-v8a
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exposes ACTIONS_RUNTIME_TOKEN and ACTIONS_CACHE_URL to the shell so
      # that `docker buildx build --cache-{from,to} type=gha` can talk to
      # the GitHub Actions cache service. setup-buildx-action does NOT do
      # this on its own when you invoke buildx via a shell script rather
      # than the docker/build-push-action wrapper.
      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build Ubuntu rootfs
        shell: bash
        env:
          ENABLE_BROWSER_STACK: ${{ github.event.inputs.enable_browser_stack || '0' }}
          # Per-arch scope keeps arm64 and x86_64 caches independent so
          # neither arch evicts the other's layers.
          BUILDX_CACHE_FROM: type=gha,scope=ubuntu-rootfs-${{ matrix.arch }}
          BUILDX_CACHE_TO: type=gha,mode=max,scope=ubuntu-rootfs-${{ matrix.arch }}
        run: |
          chmod +x tools/bootstrap/bake-ubuntu.sh
          tools/bootstrap/bake-ubuntu.sh --arch "${{ matrix.arch }}" --output-dir tools/bootstrap/output/rootfs

      - name: Summarize artifact contents
        shell: bash
        run: |
          ls -lah tools/bootstrap/output/rootfs/
          ls -lah "tools/bootstrap/output/rootfs/${{ matrix.arch }}/"
          find "tools/bootstrap/output/rootfs/${{ matrix.arch }}/" -maxdepth 1 -type f -print

      - name: Upload rootfs artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-rootfs-${{ matrix.arch }}
          path: |
            tools/bootstrap/output/rootfs/${{ matrix.arch }}/**
