name: Automatic Dependency Submission

on:
  workflow_dispatch:
  # NOTE(claw800): upstream Termux CI triggers disabled during Phase 2
  # iteration to avoid burning Actions minutes on every master push.
  # Re-enable once the fork stabilizes.
  # push:
  #   branches: [ 'master' ]

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v5
